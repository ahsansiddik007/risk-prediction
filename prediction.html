
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Health Input</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8fb;
            color: #1f2937;
        }

        header {
            background: #0f4c81;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 24px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        header a:hover {
            color: #b9e6ff;
        }

        a:focus-visible,
        input:focus-visible,
        button:focus-visible {
            outline: 3px solid #f59e0b;
            outline-offset: 3px;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .container h1 {
            text-align: center;
            color: #0f4c81;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
        }

        input {
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            border-color: #0f4c81;
        }

        .button-area {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 14px 35px;
            background: #0f4c81;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #083b63;
        }

        .note {
            margin-top: 25px;
            padding: 15px;
            background: #eef6ff;
            border-left: 4px solid #0f4c81;
            color: #374151;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 25px 15px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>DiseasePredict</h2>
        <a href="index.html">← Home</a>
    </header>

    <main>

        <div class="container">

            <h1>Patient Health Information</h1>

            <p class="description">
                Enter the required health parameters for diabetes risk prediction.
            </p>

            <form action="/predict" method="POST">

                <div class="form-grid">

                    <!-- Pregnancies -->
                    <div class="form-group">
                        <label for="pregnancies">
                            Number of Pregnancies
                        </label>

                        <input
                            type="number"
                            id="pregnancies"
                            name="pregnancies"
                            min="0"
                            placeholder="Example: 2"
                            required>
                    </div>

                    <!-- Glucose -->
                    <div class="form-group">
                        <label for="glucose">
                            Glucose Level
                        </label>

                        <input
                            type="number"
                            id="glucose"
                            name="glucose"
                            min="0"
                            placeholder="Example: 120"
                            required>
                    </div>

                    <!-- Blood Pressure -->
                    <div class="form-group">
                        <label for="blood_pressure">
                            Blood Pressure
                        </label>

                        <input
                            type="number"
                            id="blood_pressure"
                            name="blood_pressure"
                            min="0"
                            placeholder="Example: 70"
                            required>
                    </div>

                    <!-- Skin Thickness -->
                    <div class="form-group">
                        <label for="skin_thickness">
                            Skin Thickness
                        </label>

                        <input
                            type="number"
                            id="skin_thickness"
                            name="skin_thickness"
                            min="0"
                            placeholder="Example: 20"
                            required>
                    </div>

                    <!-- Insulin -->
                    <div class="form-group">
                        <label for="insulin">
                            Insulin Level
                        </label>

                        <input
                            type="number"
                            id="insulin"
                            name="insulin"
                            min="0"
                            placeholder="Example: 80"
                            required>
                    </div>

                    <!-- BMI -->
                    <div class="form-group">
                        <label for="bmi">
                            BMI
                        </label>

                        <input
                            type="number"
                            id="bmi"
                            name="bmi"
                            step="0.1"
                            min="0"
                            placeholder="Example: 25.5"
                            required>
                    </div>

                    <!-- Diabetes Pedigree Function -->
                    <div class="form-group">
                        <label for="pedigree">
                            Diabetes Pedigree Function
                        </label>

                        <input
                            type="number"
                            id="pedigree"
                            name="pedigree"
                            step="0.001"
                            min="0"
                            placeholder="Example: 0.351"
                            required>
                    </div>

                    <!-- Age -->
                    <div class="form-group">
                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            min="1"
                            max="120"
                            placeholder="Example: 30"
                            required>
                    </div>

                </div>

                <div class="button-area">
                    <button type="submit">
                        Predict Disease Risk
                    </button>
                </div>

            </form>

            <div class="note">
                <strong>Note:</strong>
                This is an educational AI & ML project. The prediction
                is a machine-learning model output and should not be
                considered a medical diagnosis.
            </div>

        </div>

    </main>

</body>
</html>
